<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIDA Agent — Santral Girişi</title>
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <main class="shell">
    <section class="login-card">
      <header class="brand-header">
        <div class="logo-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8" />
            <rect width="16" height="12" x="4" y="8" rx="2" />
            <path d="M2 14h2" />
            <path d="M20 14h2" />
            <path d="M15 13v2" />
            <path d="M9 13v2" />
          </svg>
        </div>
        <div>
          <h1 class="brand-title"><span>AI</span>DA Agent</h1>
          <p class="brand-sub">MASAÜSTÜ TEMSİLCİ ÇAĞRI PANELİ</p>
        </div>
      </header>

      <!-- Quick Magic Link (URL) Login Box -->
      <div class="magic-login-box">
        <div class="label-row">
          <label for="magicUrlInput">KOLAY GİRİŞ LİNKİ (URL) İLE GİRİŞ</label>
        </div>
        <div class="input-with-btn">
          <input
            id="magicUrlInput"
            type="text"
            placeholder="Kolay Giriş URL'ini buraya yapıştırın..."
            spellcheck="false"
          />
          <button type="button" id="magicLoginBtn" class="btn-magic">
            Bağlan
          </button>
        </div>
      </div>

      <div class="login-divider"><span>VEYA STANDART GİRİŞ</span></div>

      <!-- Primary Credentials Form -->
      <form id="loginForm" autocomplete="off">
        <!-- Host Input -->
        <div class="field-group">
          <label for="hostInput">SUNUCU ADRESİ (HOST)</label>
          <input
            id="hostInput"
            type="text"
            placeholder="Örn: santral.sirket.com veya 192.168.1.50"
            required
            spellcheck="false"
          />
          <div id="recentHostsWrap" class="recent-hosts hidden"></div>
        </div>

        <!-- Username / Extension -->
        <div class="field-group">
          <label for="usernameInput">KULLANICI ADI VEYA DAHİLİ</label>
          <input
            id="usernameInput"
            type="text"
            placeholder="Kullanıcı adı, e-posta veya dahili (1001)"
            required
            spellcheck="false"
          />
        </div>

        <!-- Password -->
        <div class="field-group">
          <label for="passwordInput">ŞİFRE</label>
          <div class="password-wrap">
            <input
              id="passwordInput"
              type="password"
              placeholder="••••••••"
              required
            />
            <button type="button" id="togglePwdBtn" class="pwd-eye-icon" title="Şifreyi Göster / Gizle" aria-label="Şifreyi Göster / Gizle">
              <!-- Eye Icon (default) -->
              <svg id="eyeOpenIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- EyeOff Icon (hidden by default) -->
              <svg id="eyeClosedIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" x2="22" y1="2" y2="22" />
              </svg>
            </button>
          </div>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="rememberCheckbox" checked />
          <span>Beni hatırla</span>
        </label>

        <div id="loginErrorBox" class="error-box hidden"></div>

        <button type="submit" id="submitLoginBtn" class="btn-submit">
          <span>Giriş Yap</span>
        </button>
      </form>

      <!-- 2FA Step -->
      <form id="twoFactorForm" class="hidden" autocomplete="off">
        <div class="twofa-info">
          <strong id="twoFaTitle">İki Aşamalı Doğrulama</strong>
          <p id="twoFaDesc">Lütfen 6 haneli güvenlik kodunu giriniz.</p>
        </div>

        <div class="field-group">
          <label for="twoFaCodeInput">6 HANELİ DOĞRULAMA KODU</label>
          <input
            id="twoFaCodeInput"
            type="text"
            inputmode="numeric"
            maxlength="6"
            placeholder="000000"
            class="code-input"
            required
          />
        </div>

        <div id="twoFaErrorBox" class="error-box hidden"></div>

        <div class="twofa-actions">
          <button type="button" id="backToLoginBtn" class="btn-secondary">Geri Dön</button>
          <button type="button" id="resend2faBtn" class="btn-secondary hidden">Kodu Gönder</button>
          <button type="submit" id="verify2faBtn" class="btn-submit">Doğrula</button>
        </div>
      </form>
    </section>
  </main>

  <script src="./login.js"></script>
</body>
</html>
