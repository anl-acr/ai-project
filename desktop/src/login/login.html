<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runa</title>
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <!-- Nornia/Runa Palette Aurora Orbs -->
  <div class="bg-orb orb-emerald"></div>
  <div class="bg-orb orb-sky"></div>
  <div class="bg-orb orb-purple"></div>
  <div class="bg-orb orb-orange"></div>

  <!-- Decorative subtle soundwave SVG in background -->
  <svg class="bg-wave" viewBox="0 0 1440 320" fill="none" aria-hidden="true">
    <path d="M0 160 Q 180 40, 360 160 T 720 160 T 1080 160 T 1440 160" stroke="url(#runaWaveGrad)" stroke-width="3" fill="none" />
    <path d="M0 160 Q 180 280, 360 160 T 720 160 T 1080 160 T 1440 160" stroke="url(#runaWaveGrad)" stroke-width="2" stroke-dasharray="8 8" fill="none" />
    <defs>
      <linearGradient id="runaWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#16A34A" />
        <stop offset="30%" stop-color="#0284C7" />
        <stop offset="60%" stop-color="#7C3AED" />
        <stop offset="85%" stop-color="#DB2777" />
        <stop offset="100%" stop-color="#EA580C" />
      </linearGradient>
    </defs>
  </svg>

  <main class="shell">
    <section class="login-card">
      <!-- Top Rainbow Accent Bar -->
      <div class="rainbow-top-bar"></div>

      <!-- Top-Right Magic Link (URL) Toggle Button (replaces QR button on desktop) -->
      <button
        type="button"
        id="toggleMagicBoxBtn"
        class="top-right-magic-btn"
        title="Kolay Giriş Linki (URL) ile Otomatik Bağlan"
        aria-label="Kolay Giriş Linki (URL) ile Otomatik Bağlan"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
      </button>

      <div class="card-inner">
        <!-- Centered Logo & Title -->
        <header class="brand-header">
          <div class="logo-box">
            <img src="../../assets/icon.png" alt="Runa" />
          </div>
          <h1 class="brand-title">Runa</h1>
          <p class="brand-sub">Masaüstü Temsilci Çağrı Paneli</p>
        </header>

        <!-- Collapsible Quick Magic Link (URL) Login Box -->
        <div id="magicLoginBox" class="magic-login-box hidden">
          <div class="label-row">
            <label for="magicUrlInput">KOLAY GİRİŞ LİNKİ (URL) İLE OTOMATİK BAĞLAN</label>
          </div>
          <div class="input-with-btn">
            <div class="icon-input-wrap flex-1">
              <svg class="input-leading-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
              <input
                id="magicUrlInput"
                type="text"
                placeholder="Kolay Giriş URL'ini buraya yapıştırın..."
                spellcheck="false"
              />
            </div>
            <button type="button" id="magicLoginBtn" class="btn-magic">
              Bağlan
            </button>
          </div>
        </div>

        <!-- Primary Credentials Form -->
        <form id="loginForm" autocomplete="off">
          <!-- Host Input -->
          <div class="field-group">
            <div class="icon-input-wrap">
              <svg class="input-leading-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M3.6 9h16.8M3.6 15h16.8M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
              </svg>
              <input
                id="hostInput"
                type="text"
                placeholder="Sunucu Adresi (Örn: aida.saphira.com.tr)"
                required
                spellcheck="false"
              />
            </div>
            <div id="recentHostsWrap" class="recent-hosts hidden"></div>
          </div>

          <!-- Username / Extension -->
          <div class="field-group">
            <div class="icon-input-wrap">
              <svg class="input-leading-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" />
                <path d="M12 14a7 7 0 0 0-7 7h14a7 7 0 0 0-7-7Z" />
              </svg>
              <input
                id="usernameInput"
                type="text"
                placeholder="Kullanıcı Adı, E-Posta veya Dahili (1000)"
                required
                spellcheck="false"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <div class="icon-input-wrap password-wrap">
              <svg class="input-leading-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 1 1 8 0v4" />
              </svg>
              <input
                id="passwordInput"
                type="password"
                placeholder="••••••••••"
                required
              />
              <button type="button" id="togglePwdBtn" class="pwd-eye-icon" title="Şifreyi Göster / Gizle" aria-label="Şifreyi Göster / Gizle">
                <svg id="eyeOpenIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg id="eyeClosedIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                  <line x1="2" x2="22" y1="2" y2="22" />
                </svg>
              </button>
            </div>
          </div>

          <div class="login-options-row">
            <label class="remember-row">
              <input type="checkbox" id="rememberCheckbox" checked />
              <span>Beni hatırla</span>
            </label>
            <label class="remember-row" title="Bilgisayar açıldığında Runa otomatik olarak başlasın">
              <input type="checkbox" id="startOnBootCheckbox" />
              <span>Bilgisayar açıldığında başlat</span>
            </label>
          </div>

          <div id="loginErrorBox" class="error-box hidden"></div>

          <button type="submit" id="submitLoginBtn" class="btn-submit">
            <span id="submitLoginLabel">Giriş Yap</span>
            <span class="btn-arrow">→</span>
          </button>
        </form>

        <!-- 2FA Step -->
        <form id="twoFactorForm" class="hidden" autocomplete="off">
          <div class="twofa-info">
            <strong id="twoFaTitle">İki Aşamalı Doğrulama</strong>
            <p id="twoFaDesc">Lütfen 6 haneli güvenlik kodunu giriniz.</p>
          </div>

          <div class="field-group">
            <label for="twoFaCodeInput">6 HANELİ DOĞRULAMA KODU</label>
            <input
              id="twoFaCodeInput"
              type="text"
              inputmode="numeric"
              maxlength="6"
              placeholder="000000"
              class="code-input"
              required
            />
          </div>

          <div id="twoFaErrorBox" class="error-box hidden"></div>

          <div class="twofa-actions">
            <button type="button" id="backToLoginBtn" class="btn-secondary">Geri Dön</button>
            <button type="button" id="resend2faBtn" class="btn-secondary hidden">Kodu Gönder</button>
            <button type="submit" id="verify2faBtn" class="btn-submit">Doğrula</button>
          </div>
        </form>
      </div>
    </section>

    <footer class="login-footer">
      © 2026 RUNA. Tüm hakları saklıdır.
    </footer>
  </main>

  <script src="./login.js"></script>
</body>
</html>
