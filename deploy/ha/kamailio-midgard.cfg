#!KAMAILIO
# ==============================================================================
# Nornia Midgard / Odin — Edge SIP & WebRTC (WSS) Load Balancer + Failover
# Handles:
#   - UDP/TCP 5060 (IP Phones & SIP Trunks)
#   - WSS/TLS 8089 (WebRTC Web Phone, Runa Desktop & Runa Mobile)
#   - RTPEngine DTLS-SRTP <-> RTP bridging (127.0.0.1:22222)
#   - Active-Active 2x Asterisk Failover via dispatcher (5s OPTIONS healthcheck)
# ==============================================================================
#!define WITH_TLS
#!define WITH_WEBSOCKETS
#!define WITH_RTPENGINE
#!define WITH_DISPATCHER

debug=2
log_stderror=yes
fork=yes
children=4
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes
enable_tls=yes
auto_aliases=no

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:8089

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "path.so"
loadmodule "tls.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "rtpengine.so"
loadmodule "dispatcher.so"
loadmodule "pike.so"

modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("path", "use_received", 1)

# RTPEngine control socket
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

# Dispatcher — Active-Active Asterisk Pool with 5s OPTIONS Probing
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_from", "sip:healthcheck@nornia.local")
modparam("dispatcher", "ds_ping_interval", 5)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_probing_threshold", 2)
modparam("dispatcher", "ds_inactive_threshold", 2)

# Anti-flood pike protection
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 120)
modparam("pike", "remove_latency", 30)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    # Preserve WebRTC / NAT source address
    force_rport();
    if (nat_uac_test("64")) {
        fix_nated_register();
        if (is_first_hop()) {
            set_contact_alias();
        }
    }

    if (has_totag()) {
        if (loose_route()) {
            if (is_method("INVITE|UPDATE|ACK") && has_body("application/sdp")) {
                route(RTP_MANAGE);
            }
            if (is_method("BYE|CANCEL")) {
                rtpengine_delete();
            }
            handle_ruri_alias();
            t_relay();
            exit;
        }
        sl_send_reply("404", "Not Here");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            rtpengine_delete();
            t_relay();
        }
        exit;
    }

    t_check_trans();
    record_route();

    if (is_method("REGISTER")) {
        add_path_received();
    }

    # Select healthy Asterisk node (Algorithm 4 = Round-Robin across active set 1)
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "[Nornia-Kamailio] No healthy Asterisk nodes available in dispatcher set 1!\n");
        sl_send_reply("503", "No Media Node Available");
        exit;
    }

    if (is_method("INVITE") && has_body("application/sdp")) {
        route(RTP_MANAGE);
    }

    t_on_reply("MANAGE_REPLY");
    t_on_failure("DISPATCH_FAILOVER");

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

route[RTP_MANAGE] {
    if ($proto == "ws" || $proto == "wss") {
        # Client is WebRTC (DTLS-SRTP/ICE) -> Asterisk internal RTP/AVP
        rtpengine_manage("replace-origin replace-session-connection ICE=remove DTLS=off RTP/AVP rtcp-mux-demux");
    } else {
        # Standard SIP UDP/TCP phone or trunk
        rtpengine_manage("replace-origin replace-session-connection trust-address");
    }
}

onreply_route[MANAGE_REPLY] {
    if (nat_uac_test("64")) {
        add_contact_alias();
    }
    if (has_body("application/sdp")) {
        if ($proto == "ws" || $proto == "wss") {
            rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive RTP/SAVPF rtcp-mux-offer generate-mid");
        } else {
            rtpengine_manage("replace-origin replace-session-connection trust-address");
        }
    }
}

failure_route[DISPATCH_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
    # Automatic failover to surviving Asterisk node on timeout or 5xx
    if (t_branch_timeout() || t_check_status("5[0-9][0-9]")) {
        xlog("L_WARN", "[Nornia-Kamailio] Primary Asterisk failed ($rs), failing over to next node...\n");
        ds_mark_dst("ip");
        if (ds_next_dst()) {
            t_on_failure("DISPATCH_FAILOVER");
            t_relay();
            exit;
        }
    }
}

event_route[xhttp:request] {
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade") {
        if (ws_handle_handshake()) {
            exit;
        }
    }
    xhttp_reply("404", "Not Found", "text/plain", "Nornia WebRTC SIP Gateway");
}
