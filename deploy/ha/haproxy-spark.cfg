# ==============================================================================
# Nornia Spark — HAProxy Load Balancer & Zero-Downtime Rolling Update Config
# ==============================================================================
global
    log stdout format raw local0
    maxconn 8192
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  3600s
    retries 3
    option  redispatch

# Live HAProxy Stats Dashboard (Bind localhost/internal only)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /haproxy-stats
    stats refresh 5s

# ------------------------------------------------------------------------------
# HTTP / HTTPS Entrypoint (Frontend + API + WebSockets)
# ------------------------------------------------------------------------------
frontend ft_nornia_web
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/nornia.pem alpn h2,http/1.1
    http-request redirect scheme https code 301 unless { ssl_fc }

    acl is_api       path_beg /api /uploads /static /ws /openapi.json /docs
    acl is_ws_hdr    hdr(Upgrade) -i websocket
    acl is_webrtc_ws path_beg /ws-sip

    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Real-IP %[src]

    use_backend bk_asterisk_wss if is_webrtc_ws
    use_backend bk_nornia_api   if is_api
    use_backend bk_nornia_api   if is_ws_hdr
    default_backend bk_nornia_web

# Dedicated WebRTC WSS Port (8089 -> Asterisk local WSS/WS)
frontend ft_webrtc_wss
    bind *:8089 ssl crt /etc/haproxy/certs/nornia.pem
    mode http
    timeout client 3600s
    timeout tunnel 3600s
    http-request set-header X-Real-IP %[src]
    default_backend bk_asterisk_wss

# Internal Asterisk -> Backend API Load Balancer (Port 8000 internal)
frontend ft_internal_api
    bind *:8000
    mode http
    default_backend bk_nornia_api

# Internal Asterisk -> AudioSocket AI Voice TCP Pool (Port 9092)
frontend ft_audiosocket_tcp
    bind *:9092
    mode tcp
    option tcplog
    timeout client 3600s
    default_backend bk_audiosocket_pool

# ------------------------------------------------------------------------------
# Backends with Deep Healthchecks (/api/system/ready)
# ------------------------------------------------------------------------------
backend bk_nornia_api
    mode http
    balance leastconn
    option httpchk GET /api/system/ready
    http-check expect status 200
    default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
    server backend-1 nornia-backend-1:8000 check
    server backend-2 nornia-backend-2:8000 check

backend bk_nornia_web
    mode http
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    default-server inter 5s fall 2 rise 2
    server frontend-1 nornia-frontend-1:3000 check
    server frontend-2 nornia-frontend-2:3000 check

backend bk_audiosocket_pool
    mode tcp
    balance leastconn
    timeout server 3600s
    server as-1 nornia-backend-1:9092 check port 8000 inter 3s fall 2 rise 2
    server as-2 nornia-backend-2:9092 check port 8000 inter 3s fall 2 rise 2

backend bk_asterisk_wss
    mode http
    timeout server 3600s
    timeout tunnel 3600s
    server asterisk-host 127.0.0.1:8088 check inter 5s fall 2 rise 2
