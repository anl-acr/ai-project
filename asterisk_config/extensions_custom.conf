; ==========================================
; DINAMIK OLARAK OLUŞTURULAN EXTENSIONS (DIALPLAN) AYARLARI
; ==========================================

[from-trunk]
include => default

[from-pstn]
include => default

[from-sip]
include => default



[trunk-outbound-headers]
exten => s,1,NoOp(Trunk Giden SIP Basliklari Uygulanıyor: Trunk=${OUT_TRUNK_NAME})
same => n,GotoIf($["${OUT_HDR_DIVERSION}" = ""]?chk_rpid)
same => n,Set(PJSIP_HEADER(add,Diversion)=${OUT_HDR_DIVERSION})
same => n(chk_rpid),GotoIf($["${OUT_HDR_RPID}" = ""]?chk_pai)
same => n,Set(PJSIP_HEADER(add,Remote-Party-ID)=${OUT_HDR_RPID})
same => n(chk_pai),GotoIf($["${OUT_HDR_PAI}" = ""]?chk_ppi)
same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=${OUT_HDR_PAI})
same => n(chk_ppi),GotoIf($["${OUT_HDR_PPI}" = ""]?chk_ptime)
same => n,Set(PJSIP_HEADER(add,P-Preferred-Identity)=${OUT_HDR_PPI})
same => n(chk_ptime),GotoIf($["${OUT_MAXPTIME}" = ""]?done_hdrs)
same => n,Set(PJSIP_HEADER(add,X-Maxptime)=${OUT_MAXPTIME})
same => n(done_hdrs),Return()

[outbound_pin_auth_sub]
exten => s,1,NoOp(Giden Arama Parola Dogrulamasi Basladi: Kural=${ARG1}, Arayan=${CALLERID(num)}, Aranan=${ARG2})
same => n,Set(PIN_RULE_ID=${ARG1})
same => n,Set(PIN_CALLEE=${ARG2})
same => n,Set(PIN_ATTEMPT=0)
same => n,Answer()
same => n,Wait(0.3)
same => n(pin_ask_loop),Set(PIN_ATTEMPT=$[${PIN_ATTEMPT} + 1])
same => n,Set(ENTERED_PIN=)
same => n,Read(ENTERED_PIN,/var/spool/asterisk/monitor/tr_giden_parola,12,,,6)
same => n,Set(CURLOPT(conntimeout)=1)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(PIN_VER_RES=${CURL(http://127.0.0.1:8000/api/acl/verify_outbound_pin?rule_id=${URIENCODE(${PIN_RULE_ID})}&caller=${URIENCODE(${CALLERID(num)})}&callee=${URIENCODE(${PIN_CALLEE})}&pin=${URIENCODE(${ENTERED_PIN})}&attempt=${PIN_ATTEMPT})})
same => n,GotoIf($["${PIN_VER_RES}" = "ALLOW"]?pin_ok)
same => n,Playback(/var/spool/asterisk/monitor/tr_hatali_parola)
same => n,GotoIf($[${PIN_ATTEMPT} < 3]?pin_ask_loop)
same => n,Return(DENY)
same => n(pin_ok),Return(ALLOW)

[queue_router_sub]
exten => s,1,NoOp(Kuyruk Yonlendirme Motoru Basladi: Kuyruk=${ARG1}, CallID=${CALL_UUID})
same => n,Set(__DYNAMIC_FEATURES=rec_pause_toggle)
same => n,Set(CURLOPT(conntimeout)=1)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(CUR_Q_EXT=${ARG1})
same => n,Set(Q_FB_DEPTH=0)
same => n,Set(FALLBACK_HANDLED=0)
same => n(q_eval_entry),Set(Q_FB_DEPTH=$[${Q_FB_DEPTH} + 1])
same => n,GotoIf($[${Q_FB_DEPTH} > 5]?q_ret)
same => n,Set(Q_FREE_CNT=${QUEUE_MEMBER(${CUR_Q_EXT},free)})
same => n,Set(Q_LOGGED_CNT=${QUEUE_MEMBER(${CUR_Q_EXT},logged)})
same => n,Set(Q_PRE_RES=${CURL(http://127.0.0.1:8000/api/queues/evaluate_routing?queue_ext=${URIENCODE(${CUR_Q_EXT})}&stage=before&free_cnt=${URIENCODE(${Q_FREE_CNT})}&logged_cnt=${URIENCODE(${Q_LOGGED_CNT})}&call_id=${URIENCODE(${CALL_UUID})}&caller=${URIENCODE(${CALLERID(num)})})})
same => n,Set(Q_MODE=${CUT(Q_PRE_RES,|,1)})
same => n,Set(Q_ANN_WAV=${CUT(Q_PRE_RES,|,2)})
same => n,Set(Q_ACT_TYPE=${CUT(Q_PRE_RES,|,3)})
same => n,Set(Q_ACT_TARGET=${CUT(Q_PRE_RES,|,4)})
same => n,Set(Q_MAX_WAIT=${CUT(Q_PRE_RES,|,5)})
same => n,GotoIf($["${Q_MODE}" = "FALLBACK"]?q_exec_fallback)
same => n(q_do_queue),Set(Q_DISP_NAME=${CURL(http://127.0.0.1:8000/api/queues/resolve_display_name?queue_ext=${URIENCODE(${CUR_Q_EXT})}&call_id=${CALL_UUID}&caller=${URIENCODE(${CALLERID(num)})})})
same => n,Set(ORIG_CID_LABEL=${IF($["${ORIG_CID_LABEL}" != ""]?${ORIG_CID_LABEL}:${IF($["${CALLERID(name)}" != "" & "${CALLERID(name)}" != "${CALLERID(num)}"]?${CALLERID(name)}:${CALLERID(num)})})})
same => n,Set(CALLERID(name)=${IF($["${Q_DISP_NAME}" != ""]?[${Q_DISP_NAME}] ${ORIG_CID_LABEL}:${ORIG_CID_LABEL})})
same => n,GotoIf($["${Q_MAX_WAIT}" != ""]?q_with_timeout:q_no_timeout)
same => n(q_with_timeout),Queue(${CUR_Q_EXT},tTc,,,${Q_MAX_WAIT})
same => n,Goto(q_after_queue)
same => n(q_no_timeout),Queue(${CUR_Q_EXT},tTc)
same => n(q_after_queue),GotoIf($["${MEMBERINTERFACE}" != ""]?q_answered)
same => n,Set(Q_POST_RES=${CURL(http://127.0.0.1:8000/api/queues/evaluate_routing?queue_ext=${URIENCODE(${CUR_Q_EXT})}&stage=after&queuestatus=${URIENCODE(${QUEUESTATUS})}&call_id=${URIENCODE(${CALL_UUID})}&caller=${URIENCODE(${CALLERID(num)})})})
same => n,Set(Q_MODE=${CUT(Q_POST_RES,|,1)})
same => n,GotoIf($["${Q_MODE}" != "FALLBACK"]?q_unanswered)
same => n,Set(Q_ANN_WAV=${CUT(Q_POST_RES,|,2)})
same => n,Set(Q_ACT_TYPE=${CUT(Q_POST_RES,|,3)})
same => n,Set(Q_ACT_TARGET=${CUT(Q_POST_RES,|,4)})
same => n,Goto(q_exec_fallback)
same => n(q_exec_fallback),NoOp(Kuyruk Fallback Uygulaniyor: Ann=${Q_ANN_WAV} Act=${Q_ACT_TYPE} Target=${Q_ACT_TARGET})
same => n,Set(FALLBACK_HANDLED=1)
same => n,GotoIf($["${Q_ANN_WAV}" = ""]?q_dispatch_act)
same => n,Answer()
same => n,Playback(/var/spool/asterisk/monitor/${Q_ANN_WAV})
same => n(q_dispatch_act),GotoIf($["${Q_ACT_TYPE}" = "CONTINUE_QUEUE"]?q_cont_queue)
same => n,GotoIf($["${Q_ACT_TYPE}" = "HANGUP"]?q_fb_hangup)
same => n,GotoIf($["${Q_ACT_TYPE}" = "VOICEMAIL"]?q_fb_voicemail)
same => n,GotoIf($["${Q_ACT_TYPE}" = "QUEUE"]?q_fb_queue)
same => n,GotoIf($["${Q_ACT_TYPE}" = "USER"]?q_fb_user)
same => n,GotoIf($["${Q_ACT_TYPE}" = "GSM"]?q_fb_gsm)
same => n,GotoIf($["${Q_ACT_TYPE}" = "AUDIOSOCKET"]?q_fb_audiosocket)
same => n,Goto(q_fb_hangup)
same => n(q_cont_queue),Set(Q_FB_DEPTH=$[${Q_FB_DEPTH} + 1])
same => n,GotoIf($[${Q_FB_DEPTH} > 6]?q_fb_hangup)
same => n,Set(FALLBACK_HANDLED=0)
same => n,Goto(q_do_queue)
same => n(q_fb_queue),GotoIf($["${Q_ACT_TARGET}" = ""]?q_fb_hangup)
same => n,Set(CUR_Q_EXT=${Q_ACT_TARGET})
same => n,Goto(q_eval_entry)
same => n(q_fb_voicemail),Set(Q_VM_EXT=${IF($["${Q_ACT_TARGET}" != ""]?${Q_ACT_TARGET}:${CUR_Q_EXT})})
same => n,Gosub(voicemail_record_sub,s,1(${Q_VM_EXT}))
same => n,Set(DIALSTATUS=NOANSWER)
same => n,Goto(q_ret)
same => n(q_fb_user),GotoIf($["${Q_ACT_TARGET}" = ""]?q_fb_hangup)
same => n,Set(FB_EP_LIST=${CURL(http://127.0.0.1:8000/api/subscriber/resolve_agent_ring_targets?extension=${URIENCODE(${Q_ACT_TARGET})}&format=list)})
same => n,GotoIf($["${FB_EP_LIST}" != "" & "${FB_EP_LIST}" != "NONE"]?q_fb_build_ep)
same => n,Set(FB_EP_LIST=${Q_ACT_TARGET})
same => n(q_fb_build_ep),Gosub(build_multi_pjsip_dial_sub,s,1(${FB_EP_LIST}))
same => n,GotoIf($["${MULTI_DIAL_STR}" != ""]?q_fb_dial_multi)
same => n,Set(FB_DIAL_STR=PJSIP/${Q_ACT_TARGET})
same => n,Goto(q_fb_exec_dial)
same => n(q_fb_dial_multi),Set(FB_DIAL_STR=${MULTI_DIAL_STR})
same => n(q_fb_exec_dial),Dial(${FB_DIAL_STR},30,tTg)
same => n,Goto(q_ret)
same => n(q_fb_gsm),GotoIf($["${Q_ACT_TARGET}" = ""]?q_fb_hangup)
same => n,Gosub(outbound_failover_dial_sub,s,1(${Q_ACT_TARGET},${Q_ACT_TARGET},45,0))
same => n,Goto(q_ret)
same => n(q_fb_audiosocket),Answer()
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
same => n(q_fb_hangup),Set(DIALSTATUS=NOANSWER)
same => n,Goto(q_ret)
same => n(q_answered),Set(DIALSTATUS=ANSWER)
same => n,Goto(q_ret)
same => n(q_unanswered),Set(DIALSTATUS=NOANSWER)
same => n(q_ret),Return()

exten => h,1,NoOp(Kuyruk alt rutini sonlandi. Call ID: ${CALL_UUID}, Status: ${DIALSTATUS}, QueueStatus: ${QUEUESTATUS}, Member: ${MEMBERINTERFACE}, Cause: ${HANGUPCAUSE})
same => n,StopMixMonitor()
same => n,GotoIf($["${CALL_UUID}" = ""]?done_qsub_h)
same => n,Set(CURLOPT(conntimeout)=1)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(CURL_RESULT=${CURL(http://127.0.0.1:8000/api/calls/end?call_id=${CALL_UUID}&dialstatus=${DIALSTATUS}&hangupcause=${HANGUPCAUSE}&queuestatus=${QUEUESTATUS}&memberinterface=${URIENCODE(${MEMBERINTERFACE})}&hangupsource=${URIENCODE(${CHANNEL(hangupsource)})}&trunk=${URIENCODE(${OUT_TRUNK_NAME})}&answeredtime=${ANSWEREDTIME}&dialedtime=${DIALEDTIME})})
same => n(done_qsub_h),NoOp(Kuyruk Hangup tamamlandi)

[default]
; Operatörden gelen aramaları yakalamak için (Standart numara eşleşmesi)
exten => _X.,1,NoOp(Gelen arama DID ile yakalandi: ${EXTEN} - Arayan: ${CALLERID(num)})
same => n,Set(__DYNAMIC_FEATURES=rec_pause_toggle)
same => n,Set(RAW_DEF_FROM=${PJSIP_HEADER(read,From)})
same => n,Set(PARSED_DEF_FROM=${CUT(CUT(CUT(RAW_DEF_FROM,@,1),:,2),>,1)})
same => n,Set(CALLERID(num)=${IF($["${CALLERID(num)}" = "" | "${CALLERID(num)}" = "${EXTEN}" | "${CALLERID(num)}" = "908503607390"]?${IF($["${PARSED_DEF_FROM}" != ""]?${PARSED_DEF_FROM}:${CALLERID(num)})}:${CALLERID(num)})})
same => n,Set(CALLERID(name)=${IF($["${CALLERID(name)}" = "" | "${CALLERID(name)}" = "${EXTEN}" | "${CALLERID(name)}" = "908503607390"]?${CALLERID(num)}:${CALLERID(name)})})
same => n,Set(UUID_VAL=${UUID()})
same => n,Set(MD5_VAL=${MD5(${UNIQUEID})})
same => n,Set(__CALL_UUID=${IF($[${ISNULL(${UUID_VAL})}]?${MD5_VAL:0:8}-${MD5_VAL:8:4}-4${MD5_VAL:13:3}-a${MD5_VAL:17:3}-${MD5_VAL:20:12}:${UUID_VAL})})
same => n,Set(CURL_RESULT=${CURL(http://127.0.0.1:8000/api/calls/register?call_id=${CALL_UUID}&did=${EXTEN}&caller=${CALLERID(num)}&asterisk_id=${UNIQUEID}&direction=inbound)})
same => n,GotoIf($["${CURL_RESULT}" = "BLOCKED"]?hangup_blocked_x)
same => n,Progress()
same => n,Answer()
same => n,MixMonitor(/var/spool/asterisk/monitor/${CALL_UUID}.wav)
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
same => n(hangup_blocked_x),NoOp(KARA LISTE / TANIMSIZ DID / GUVENLIK ENGELI: Arayan reddedildi -> ${CALLERID(num)})
same => n,Hangup(21)

; Uluslararası / + ile gelen DID numaraları için (+90...)
exten => _+X.,1,NoOp(Gelen arama +DID ile yakalandi: ${EXTEN} - Arayan: ${CALLERID(num)})
same => n,Set(__DYNAMIC_FEATURES=rec_pause_toggle)
same => n,Set(RAW_DEF_FROM=${PJSIP_HEADER(read,From)})
same => n,Set(PARSED_DEF_FROM=${CUT(CUT(CUT(RAW_DEF_FROM,@,1),:,2),>,1)})
same => n,Set(CALLERID(num)=${IF($["${CALLERID(num)}" = "" | "${CALLERID(num)}" = "${EXTEN}" | "${CALLERID(num)}" = "908503607390"]?${IF($["${PARSED_DEF_FROM}" != ""]?${PARSED_DEF_FROM}:${CALLERID(num)})}:${CALLERID(num)})})
same => n,Set(CALLERID(name)=${IF($["${CALLERID(name)}" = "" | "${CALLERID(name)}" = "${EXTEN}" | "${CALLERID(name)}" = "908503607390"]?${CALLERID(num)}:${CALLERID(name)})})
same => n,Set(UUID_VAL=${UUID()})
same => n,Set(MD5_VAL=${MD5(${UNIQUEID})})
same => n,Set(__CALL_UUID=${IF($[${ISNULL(${UUID_VAL})}]?${MD5_VAL:0:8}-${MD5_VAL:8:4}-4${MD5_VAL:13:3}-a${MD5_VAL:17:3}-${MD5_VAL:20:12}:${UUID_VAL})})
same => n,Set(CURL_RESULT=${CURL(http://127.0.0.1:8000/api/calls/register?call_id=${CALL_UUID}&did=${EXTEN}&caller=${CALLERID(num)}&asterisk_id=${UNIQUEID}&direction=inbound)})
same => n,GotoIf($["${CURL_RESULT}" = "BLOCKED"]?hangup_blocked_plus)
same => n,Progress()
same => n,Answer()
same => n,MixMonitor(/var/spool/asterisk/monitor/${CALL_UUID}.wav)
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
same => n(hangup_blocked_plus),NoOp(KARA LISTE / TANIMSIZ DID / GUVENLIK ENGELI: Arayan reddedildi -> ${CALLERID(num)})
same => n,Hangup(21)

; Fallback (s uzantısı)
exten => s,1,NoOp(Gelen arama s uzantisi ile yakalandi: ${CALLERID(num)})
same => n,Set(__DYNAMIC_FEATURES=rec_pause_toggle)
same => n,Set(RAW_DEF_FROM=${PJSIP_HEADER(read,From)})
same => n,Set(PARSED_DEF_FROM=${CUT(CUT(CUT(RAW_DEF_FROM,@,1),:,2),>,1)})
same => n,Set(CALLERID(num)=${IF($["${CALLERID(num)}" = "" | "${CALLERID(num)}" = "908503607390"]?${IF($["${PARSED_DEF_FROM}" != ""]?${PARSED_DEF_FROM}:${CALLERID(num)})}:${CALLERID(num)})})
same => n,Set(CALLERID(name)=${IF($["${CALLERID(name)}" = "" | "${CALLERID(name)}" = "908503607390"]?${CALLERID(num)}:${CALLERID(name)})})
same => n,Set(UUID_VAL=${UUID()})
same => n,Set(MD5_VAL=${MD5(${UNIQUEID})})
same => n,Set(__CALL_UUID=${IF($[${ISNULL(${UUID_VAL})}]?${MD5_VAL:0:8}-${MD5_VAL:8:4}-4${MD5_VAL:13:3}-a${MD5_VAL:17:3}-${MD5_VAL:20:12}:${UUID_VAL})})
same => n,Set(HEADER_TO=${PJSIP_HEADER(read,To)})
same => n,Set(EXTEN_FROM_HEADER=${CUT(CUT(HEADER_TO,@,1),:,2)})
same => n,Set(TRUNK_EXTEN=${CUT(CUT(CHANNEL(name),/,2),-,1)})
same => n,Set(REAL_DID=${IF($[${ISNULL(${EXTEN_FROM_HEADER})} | "${EXTEN_FROM_HEADER}"="s"]?${TRUNK_EXTEN}:${EXTEN_FROM_HEADER})})
same => n,Set(CURL_RESULT=${CURL(http://127.0.0.1:8000/api/calls/register?call_id=${CALL_UUID}&did=${REAL_DID}&caller=${CALLERID(num)}&asterisk_id=${UNIQUEID}&direction=inbound)})
same => n,GotoIf($["${CURL_RESULT}" = "BLOCKED"]?hangup_blocked_s)
same => n,Progress()
same => n,Answer()
same => n,MixMonitor(/var/spool/asterisk/monitor/${CALL_UUID}.wav)
same => n,AudioSocket(${CALL_UUID},127.0.0.1:9092)
same => n,Hangup()
same => n(hangup_blocked_s),NoOp(KARA LISTE / TANIMSIZ DID / GUVENLIK ENGELI: Arayan reddedildi -> ${CALLERID(num)})
same => n,Hangup(21)

; Hangup handler (h uzantısı)
exten => h,1,NoOp(Cagri sonlandi: ${EXTEN}, Call ID: ${CALL_UUID}, Status: ${DIALSTATUS}, QueueStatus: ${QUEUESTATUS}, Member: ${MEMBERINTERFACE}, Cause: ${HANGUPCAUSE})
same => n,StopMixMonitor()
same => n,GotoIf($["${CALL_UUID}" = ""]?done_def_h)
same => n,Set(CURLOPT(conntimeout)=1)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(CURL_RESULT=${CURL(http://127.0.0.1:8000/api/calls/end?call_id=${CALL_UUID}&dialstatus=${DIALSTATUS}&hangupcause=${HANGUPCAUSE}&queuestatus=${QUEUESTATUS}&memberinterface=${URIENCODE(${MEMBERINTERFACE})}&hangupsource=${URIENCODE(${CHANNEL(hangupsource)})}&trunk=${URIENCODE(${OUT_TRUNK_NAME})}&answeredtime=${ANSWEREDTIME}&dialedtime=${DIALEDTIME})})
same => n(done_def_h),Hangup()

; Yapay zeka aramayı insana aktarmak istediğinde AMI üzerinden bu dahili extension'a yönlendirir
exten => transfer_to_human,1,NoOp(Yapay zeka cagriyi temsilciye aktariyor: ${UNIQUEID})
same => n,StopMixMonitor()
same => n,MixMonitor(/var/spool/asterisk/monitor/${CALL_UUID}.wav,ab)
same => n,Playback(/var/spool/asterisk/monitor/tr_aktariliyor)
same => n,Gosub(queue_router_sub,s,1(temsilci_kuyrugu))
same => n,GotoIf($["${DIALSTATUS}" != "ANSWER"]?hangup_transfer)
same => n,Set(CURLOPT(conntimeout)=1)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(SURVEY_CFG=${CURL(http://127.0.0.1:8000/api/queues/survey/config?queue_ext=temsilci_kuyrugu&agent_ext=${URIENCODE(${MEMBERINTERFACE})}&call_id=${CALL_UUID})})
same => n,GotoIf($["${CUT(SURVEY_CFG,:,1)}" != "ENABLED"]?hangup_transfer)
same => n,Set(SURVEY_Q_EXT=${CUT(SURVEY_CFG,:,2)})
same => n,Set(SURVEY_MAX_DIGITS=${CUT(SURVEY_CFG,:,3)})
same => n,Set(SURVEY_TIMEOUT=${CUT(SURVEY_CFG,:,4)})
same => n,Set(SURVEY_Q_WAVS=${CUT(SURVEY_CFG,:,5)})
same => n,Set(SURVEY_TY_WAV=${CUT(SURVEY_CFG,:,6)})
same => n,Set(SURVEY_Q_CNT=${CUT(SURVEY_CFG,:,7)})
same => n,Set(SURVEY_Q_CNT=${IF($["${SURVEY_Q_CNT}" = ""]?1:${SURVEY_Q_CNT})})
same => n,Set(SURVEY_Q_IDX=1)
same => n,Set(SURVEY_ALL_SCORES=)
same => n,Set(SURVEY_ANY_ANS=0)
same => n(survey_t_loop),GotoIf($[${SURVEY_Q_IDX} > ${SURVEY_Q_CNT}]?survey_t_done)
same => n,Set(CUR_Q_WAV=${CUT(SURVEY_Q_WAVS,&,${SURVEY_Q_IDX})})
same => n,Set(CUR_Q_WAV=${IF($["${CUR_Q_WAV}" = ""]?tr_anket_soru:${CUR_Q_WAV})})
same => n,Set(SURVEY_SCORE=)
same => n,Read(SURVEY_SCORE,/var/spool/asterisk/monitor/${CUR_Q_WAV},${SURVEY_MAX_DIGITS},,,${SURVEY_TIMEOUT})
same => n,Set(SURVEY_ANY_ANS=${IF($["${SURVEY_SCORE}" != ""]?1:${SURVEY_ANY_ANS})})
same => n,Set(SURVEY_ALL_SCORES=${IF($[${SURVEY_Q_IDX} = 1]?${SURVEY_SCORE}:${SURVEY_ALL_SCORES},${SURVEY_SCORE})})
same => n,Set(SURVEY_Q_IDX=$[${SURVEY_Q_IDX} + 1])
same => n,Goto(survey_t_loop)
same => n(survey_t_done),Set(SURVEY_RES=${CURL(http://127.0.0.1:8000/api/queues/survey/submit?call_id=${CALL_UUID}&queue_ext=${SURVEY_Q_EXT}&agent_ext=${URIENCODE(${MEMBERINTERFACE})}&caller=${CALLERID(num)}&score=${URIENCODE(${SURVEY_ALL_SCORES})})})
same => n,GotoIf($["${SURVEY_ANY_ANS}" != "1"]?hangup_transfer)
same => n,Playback(/var/spool/asterisk/monitor/${SURVEY_TY_WAV})
same => n(hangup_transfer),Hangup()

[webrtc_agents]
; WebRTC istemcileri ve Masa Telefonları (temsilciler) bu context üzerinden görüşme yapar

; Kuyruk Cihaz Durumu (State Interface) ve Masa Telefonu BLF İpuçları (WebPhone + Masa Telefonu Birleşik)
exten => 1000,hint,PJSIP/Wu8Em9R5&PJSIP/Rs6Wx5K3
exten => 1001,hint,PJSIP/Ws7Gk2L5&PJSIP/Xy4Mh5B5
exten => 1002,hint,PJSIP/Wb7Xe3F4&PJSIP/Vn6Vj9B2

; Hedefli Çağrı Çekme (Directed Call Pickup: *8XXXX1001 vb.) ve Grup Çağrı Çekme (*8)
exten => _*8XXXXX.,1,NoOp(Hedefli Cagri Cekme: Ceken=${CALLERID(num)} -> Calan=${EXTEN:6})
same => n,Set(CURLOPT(conntimeout)=1)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(PICKUP_CHAN=${CURL(http://127.0.0.1:8000/api/webrtc/resolve_pickup_channel?target_ext=${EXTEN:6}&picker_ext=${CALLERID(num)})})
same => n,GotoIf($["${PICKUP_CHAN}" != "" & "${PICKUP_CHAN}" != "NONE"]?do_pickupchan:do_std_pickup)
same => n(do_pickupchan),NoOp(PickupChan ile cagri cekiliyor: ${PICKUP_CHAN})
same => n,PickupChan(${PICKUP_CHAN})
same => n(do_std_pickup),Pickup(${EXTEN:6}@webrtc_agents)
same => n,Pickup(${EXTEN:6}@default)
same => n,Hangup()

exten => *8,1,NoOp(Grup Cagri Cekme (*8): Ceken=${CALLERID(num)})
same => n,Pickup()
same => n,Hangup()

; Çağrı Yönlendirme (Her Zaman, Meşgulde, Zaman Aşımında, İptal Kodu) Prefix'leri
; Cagri Dinleme / Fisildama (ChanSpy Listen) (_*551*.)
exten => _*551*.,1,NoOp(Masa Telefonu Canli Cagri Izleme [listen]: Arayan=${CALLERID(num)}, Kod=${EXTEN})
