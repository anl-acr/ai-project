transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw,alaw,g722,g729
aors=Operator_Trunk-aor
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
outbound_auth=Operator_Trunk-auth
from_user=908503607390
from_domain=ikonsip.com

[Operator_Trunk-identify]
type=identify
endpoint=Operator_Trunk
match=ikonsip.com


