protocol=wss
bind=0.0.0.0:8089
external_media_address=78.189.210.15
external_signaling_address=78.189.210.15
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=127.0.0.1/32

; --- OPERATOR TRUNK (OUTBOUND LINK) ---
[Operator_Trunk]
type=endpoint
transport=transport-udp
context=from-trunk-908503607390
disallow=all
allow=ulaw,alaw,g722,g729
aors=908503607390-aor
outbound_auth=908503607390-auth
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
rtp_timeout=60
rtp_timeout_hold=600
rtp_keepalive=15
timers=yes
timers_min_se=90
timers_sess_expires=1800
trust_id_inbound=yes
from_user=908503607390
from_domain=ikonsip.com

