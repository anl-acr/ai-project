; ==========================================
; DINAMIK OLARAK OLUŞTURULAN SIP TRUNK AYARLARI
; ==========================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0

; --- TRUNK: Operator_Trunk (REGISTER) ---
[Operator_Trunk-reg]
type=registration
transport=transport-udp
outbound_auth=Operator_Trunk-auth
client_uri=sip:0850XXXXXXX@sip.operator.com:5060
server_uri=sip:sip.operator.com:5060
contact_user=0850XXXXXXX

[Operator_Trunk-auth]
type=auth
auth_type=userpass
username=0850XXXXXXX
password=sip_sifre_123
[Operator_Trunk-aor]
type=aor
contact=sip:sip.operator.com:5060

[Operator_Trunk]
type=endpoint
transport=transport-udp
context=default
disallow=all
allow=ulaw,alaw,g729
aors=Operator_Trunk-aor
outbound_auth=Operator_Trunk-auth
from_user=0850XXXXXXX
from_domain=sip.operator.com
[Operator_Trunk-identify]
type=identify
endpoint=Operator_Trunk
match=sip.operator.com

; ==========================================
; DINAMIK OLARAK OLUŞTURULAN KULLANICI (DAHILI) AYARLARI
; ==========================================

; --- USER: Anıl Acar (200) ---
[200](webrtc_agent_template)
type=endpoint
auth=200-auth
aors=200
callerid=Anıl Acar <200>

[200-auth]
type=auth
auth_type=userpass
username=200
password=1234

[200]
type=aor
max_contacts=5
remove_existing=yes

; --- USER: Can Yılmaz (201) ---
[201](webrtc_agent_template)
type=endpoint
auth=201-auth
aors=201
callerid=Can Yılmaz <201>

[201-auth]
type=auth
auth_type=userpass
username=201
password=1234

[201]
type=aor
max_contacts=5
remove_existing=yes
