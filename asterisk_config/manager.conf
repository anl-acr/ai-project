; ==========================================
; Asterisk Manager Interface (AMI) Yapılandırması
; ==========================================
[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[ai_backend_user]
; Generated uniquely per server by install_nornia_online.sh (SEC-06)
secret = REPLACE_WITH_RANDOM_AMI_SECRET
read = system,call,log,verbose,command,agent,user,security
write = system,call,agent,originate
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.0
