[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[ai_backend_user]
secret = backend_secure_key_99
read = system,call,log,verbose,command,agent,user
write = system,call,agent,originate
permit = 0.0.0.0/0.0.0.0
