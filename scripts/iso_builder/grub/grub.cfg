set timeout=5
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "Nornia Otomatik Kurulum (Tam Cevrimdisi - Onerilen)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz quiet autoinstall "ds=nocloud;s=/cdrom/nornia-autoinstall/auto/" ---
    initrd  /casper/initrd
}

menuentry "Nornia Kurulum (Disk Secimli / Coklu Diskli Sunucular)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz quiet autoinstall "ds=nocloud;s=/cdrom/nornia-autoinstall/interactive/" ---
    initrd  /casper/initrd
}

menuentry "Ubuntu 24.04 Standart Canli Kurtarma (Manuel)" {
    set gfxpayload=keep
    linux   /casper/vmlinuz ---
    initrd  /casper/initrd
}
